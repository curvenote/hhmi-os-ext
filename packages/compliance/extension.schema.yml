# $schema: https://json-schema.org/draft/2020-12/schema
title: 'HHMI Compliance Extension Module'
description: 'HHMI Compliance Extension Module Configuration'
type: 'object'
required:
  - noticeToJournalsPdfUrl
properties:
  task:
    type: boolean
    description: This extension will register one of more tasks
    default: false
  routes:
    type: boolean
    description: This extension will register new routes
  dataModels:
    type: boolean
    description: This extension will register new (prisma) data models and migrations
  workflows:
    type: boolean
    description: This extension will register new workflows
  navigation:
    type: boolean
    description: This extension will register new site navigation items
    default: false
  airtable:
    type: object
    required:
      - apiKey
    properties:
      apiKey:
        type: string
        secret: true
        description: Airtable API key for accessing the HHMI compliance database
  enhancedArticleRendering:
    type: boolean
    description: This flag will enable the enhanced article rendering functionality when true
    default: false
  noticeToJournalsPdfUrl:
    type: string
    format: uri
    description: >
      Fully qualified URL of the "Notice to Journals" PDF shown on the compliance
      wizard outcome screen. Opened in a new tab; may be hosted on any origin.
